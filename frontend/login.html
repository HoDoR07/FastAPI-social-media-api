<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SocialHub</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/sakura.css/css/sakura-dark.css"
>
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            SocialHub
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="active">Login</a>
            <a href="register.html">Register</a>
        </nav>

    </header>


    <!-- Login Section -->
    <main class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to continue to SocialHub
            </p>


            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn primary-btn login-btn"
                >
                    Login
                </button>

            </form>


            <!-- Error / Success Message -->
            <p id="message"></p>


            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 SocialHub. Built with FastAPI & PostgreSQL.
        </p>

    </footer>


    <script src="js/app.js"></script>

</body>
</html>
