<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Posts - SocialHub</title>

    <link
    rel="stylesheet"
    href="https://unpkg.com/sakura.css/css/sakura-dark.css"
>
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            SocialHub
        </div>

        <nav>
            <a href="posts.html" class="active">Posts</a>
            <button id="logoutBtn" class="logout-btn">
                Logout
            </button>
        </nav>

    </header>


    <!-- Main Content -->
    <main class="posts-container">

        <!-- Create Post -->
        <section class="create-post-card">

            <h1>Create a Post</h1>

            <p class="section-subtitle">
                Share your thoughts with the community.
            </p>

            <form id="createPostForm">

                <div class="form-group">

                    <label for="postTitle">
                        Title
                    </label>

                    <input
                        type="text"
                        id="postTitle"
                        name="title"
                        placeholder="Enter post title"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="postContent">
                        Content
                    </label>

                    <textarea
                        id="postContent"
                        name="content"
                        placeholder="What's on your mind?"
                        rows="5"
                        required
                    ></textarea>

                </div>


                <div class="publish-option">

                    <input
                        type="checkbox"
                        id="published"
                        checked
                    >

                    <label for="published">
                        Publish this post
                    </label>

                </div>


                <button
                    type="submit"
                    class="btn primary-btn"
                >
                    Create Post
                </button>

            </form>

            <p id="createPostMessage"></p>

        </section>


        <!-- Posts Section -->
        <section class="posts-section">

            <div class="posts-header">

                <div>
                    <h2>Latest Posts</h2>

                    <p class="section-subtitle">
                        See what the community is sharing.
                    </p>
                </div>

                <button
                    id="refreshPosts"
                    class="btn secondary-btn"
                >
                    Refresh
                </button>

            </div>


            <!-- Posts will be inserted by JavaScript -->
            <div id="postsList">

                <p id="loadingMessage">
                    Loading posts...
                </p>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 SocialHub. Built with FastAPI & PostgreSQL.
        </p>

    </footer>


    <script src="js/app.js"></script>

</body>

</html>
