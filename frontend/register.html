<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - SocialHub</title>

    <link
    rel="stylesheet"
    href="https://unpkg.com/sakura.css/css/sakura-dark.css"
>
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            SocialHub
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="active">Register</a>
        </nav>

    </header>


    <!-- Register Section -->
    <main class="auth-container">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join SocialHub and start sharing.
            </p>


            <!-- Register Form -->
            <form id="registerForm">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="btn primary-btn register-btn"
                >
                    Create Account
                </button>

            </form>


            <!-- Message -->
            <p id="message"></p>


            <!-- Login Link -->
            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 SocialHub. Built with FastAPI & PostgreSQL.
        </p>

    </footer>


    <script src="js/app.js"></script>

</body>

</html>
