<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FastAPI Social App</title>


    <!-- Sakura CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/sakura.css/css/sakura.css"
    >


    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header>

        <h1>
            FastAPI Social App
        </h1>

    </header>



    <main>


        <!-- =========================================
             AUTH SECTION
        ========================================== -->

        <section id="auth-section">


            <!-- =====================================
                 LOGIN
            ====================================== -->

            <div id="login-section">

                <h2>
                    Login
                </h2>


                <form id="login-form">


                    <label for="login-email">
                        Email
                    </label>


                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="login-password">
                        Password
                    </label>


                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        required
                    >


                    <button type="submit">
                        Login
                    </button>


                </form>


                <p id="login-message"></p>


                <p>

                    Don't have an account?

                    <button
                        type="button"
                        id="show-register"
                    >
                        Register
                    </button>

                </p>


            </div>



            <!-- =====================================
                 REGISTER
            ====================================== -->

            <div
                id="register-section"
                style="display: none;"
            >

                <h2>
                    Create Account
                </h2>


                <form id="register-form">


                    <label for="register-email">
                        Email
                    </label>


                    <input
                        type="email"
                        id="register-email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="register-password">
                        Password
                    </label>


                    <input
                        type="password"
                        id="register-password"
                        placeholder="Create a password"
                        required
                    >


                    <button type="submit">
                        Register
                    </button>


                </form>


                <p id="register-message"></p>


                <p>

                    Already have an account?

                    <button
                        type="button"
                        id="show-login"
                    >
                        Login
                    </button>

                </p>


            </div>


        </section>



        <!-- =========================================
             DASHBOARD
        ========================================== -->

        <section
            id="dashboard-section"
            style="display: none;"
        >


            <!-- =====================================
                 DASHBOARD HEADER
            ====================================== -->

            <div class="dashboard-header">

                <h2>
                    Dashboard
                </h2>


                <button
                    type="button"
                    id="logout-btn"
                >
                    Logout
                </button>

            </div>



            <!-- =====================================
                 CREATE POST
            ====================================== -->

            <section id="create-post-section">

                <h2>
                    Create Post
                </h2>


                <form id="post-form">


                    <label for="title">
                        Title
                    </label>


                    <input
                        type="text"
                        id="title"
                        placeholder="Enter post title"
                        required
                    >


                    <label for="content">
                        Content
                    </label>


                    <textarea
                        id="content"
                        placeholder="Write your post..."
                        required
                    ></textarea>


                    <label for="published">
                        Published
                    </label>


                    <select id="published">

                        <option value="true">
                            Yes
                        </option>

                        <option value="false">
                            No
                        </option>

                    </select>


                    <button type="submit">
                        Create Post
                    </button>


                </form>


                <p id="post-message"></p>


            </section>



            <hr>



            <!-- =====================================
                 ALL POSTS
            ====================================== -->

            <section id="posts-section">

                <h2>
                    All Posts
                </h2>


                <div id="posts">

                    <p>
                        Loading posts...
                    </p>

                </div>


            </section>


        </section>


    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer>

        <p>
            FastAPI Social App
        </p>

    </footer>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="/static/js/app.js"></script>


</body>

</html>
